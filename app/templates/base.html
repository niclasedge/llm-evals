<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Evaluator{% endblock %}</title>

    <!-- DaisyUI / Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.8/dist/htmx.min.js"></script>

    <!-- Custom styles -->
    <style>
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-base-100 text-base-content">
    <!-- Navigation -->
    <div class="navbar bg-base-300 shadow-lg">
        <div class="navbar-start">
            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                    </svg>
                </div>
                <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/providers">Providers</a></li>
                    <li><a href="/tests">Tests</a></li>
                    <li><a href="/results">Results</a></li>
                </ul>
            </div>
            <a class="btn btn-ghost text-xl font-bold" href="/">🤖 LLM Evaluator</a>
        </div>

        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
                <li><a href="/dashboard" class="{% block nav_dashboard %}{% endblock %}">Dashboard</a></li>
                <li><a href="/providers" class="{% block nav_providers %}{% endblock %}">Providers</a></li>
                <li><a href="/tests" class="{% block nav_tests %}{% endblock %}">Tests</a></li>
                <li><a href="/results" class="{% block nav_results %}{% endblock %}">Results</a></li>
            </ul>
        </div>

        <div class="navbar-end">
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost">
                    <div class="w-10 rounded-full">
                        <div class="avatar placeholder">
                            <div class="bg-neutral-focus text-neutral-content rounded-full w-10">
                                <span class="text-xs">AI</span>
                            </div>
                        </div>
                    </div>
                </div>
                <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
                    <li><a href="/api/docs">API Docs</a></li>
                    <li><a>Settings</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <div class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast toast-top toast-end"></div>

    <!-- Loading spinner -->
    <div id="loading-indicator" class="htmx-indicator fixed top-4 right-4 z-50">
        <div class="loading loading-spinner loading-lg text-primary"></div>
    </div>

    <script>
        // HTMX configuration
        htmx.config.globalViewTransitions = true;

        // Auto-refresh certain elements
        document.addEventListener('DOMContentLoaded', function() {
            // Refresh provider health every 30 seconds
            setInterval(function() {
                const healthEl = document.getElementById('provider-health');
                if (healthEl) {
                    htmx.trigger(healthEl, 'refresh');
                }
            }, 30000);

            // Refresh recent runs every 10 seconds
            setInterval(function() {
                const runsEl = document.getElementById('recent-runs');
                if (runsEl) {
                    htmx.trigger(runsEl, 'refresh');
                }
            }, 10000);
        });

        // Show toast notifications
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `alert alert-${type} shadow-lg mb-2`;
            toast.innerHTML = `
                <div>
                    <span>${message}</span>
                </div>
            `;
            toastContainer.appendChild(toast);

            // Auto-remove after 3 seconds
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // HTMX event handlers
        document.body.addEventListener('htmx:responseError', function(event) {
            showToast('Request failed. Please try again.', 'error');
        });

        document.body.addEventListener('htmx:timeout', function(event) {
            showToast('Request timed out. Please try again.', 'warning');
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
