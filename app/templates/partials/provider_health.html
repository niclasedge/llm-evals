<!-- Provider Health Status Partial -->
<div class="space-y-2">
    {% for provider, status in health_status.items() %}
    <div class="flex items-center justify-between p-2 bg-base-100 rounded">
        <div class="flex items-center">
            {% if status %}
                <div class="badge badge-success badge-sm mr-2">●</div>
            {% else %}
                <div class="badge badge-error badge-sm mr-2">●</div>
            {% endif %}
            <span class="font-medium capitalize">{{ provider }}</span>
        </div>
        <div class="text-xs opacity-70">
            {% if status %}
                Online
            {% else %}
                Offline
            {% endif %}
        </div>
    </div>
    {% endfor %}

    {% if not health_status %}
    <div class="text-center py-4 opacity-50">
        No providers configured
    </div>
    {% endif %}
</div>
