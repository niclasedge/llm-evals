tests:
  # Python tests
  - vars:
      language: "Python"
      task: "calculates the fibonacci sequence up to n terms"
    assert:
      - type: contains-all
        value: ["def ", "fibonacci", "return"]
      - type: llm-rubric
        value: "The code should implement a fibonacci function that calculates n terms correctly"
      - type: javascript
        value: "output.includes('def') && output.split('\\n').length > 3"

  - vars:
      language: "Python"
      task: "implements a binary search algorithm"
    assert:
      - type: contains-all
        value: ["def ", "binary", "while", "return"]
      - type: llm-rubric
        value: "The code should implement binary search with proper mid-point calculation and comparison logic"

  # JavaScript tests
  - vars:
      language: "JavaScript"
      task: "sorts an array using quicksort algorithm"
    assert:
      - type: contains-all
        value: ["function", "quicksort", "return"]
      - type: llm-rubric
        value: "The code should implement quicksort with proper partitioning and recursive calls"

  - vars:
      language: "JavaScript"
      task: "validates email addresses using regex"
    assert:
      - type: contains-all
        value: ["function", "email", "return"]
      - type: contains-any
        value: ["RegExp", "test(", "match("]
      - type: llm-rubric
        value: "The code should use regex to validate email format including @ symbol and domain"

  # Algorithm tests
  - vars:
      language: "Python"
      task: "finds the longest common subsequence of two strings"
    assert:
      - type: contains
        value: "def"
      - type: llm-rubric
        value: "The code should implement LCS algorithm using dynamic programming or recursion"

  - vars:
      language: "JavaScript"
      task: "implements a debounce function"
    assert:
      - type: contains-all
        value: ["function", "setTimeout", "return"]
      - type: llm-rubric
        value: "The code should implement debouncing with proper timeout handling and function closure"

  # Complex algorithm tests
  - vars:
      language: "Python"
      task: "implements a function to find all permutations of a string"
    assert:
      - type: contains-all
        value: ["def", "permutation"]
      - type: llm-rubric
        value: "The code should implement a permutation algorithm using either recursion or itertools, handling edge cases like empty strings, and returning all unique permutations"
      - type: javascript
        value: "output.includes('def') && (output.includes('recursive') || output.includes('itertools') || output.includes('permutation'))"

  - vars:
      language: "JavaScript"
      task: "implements a depth-first search (DFS) algorithm for a graph represented as an adjacency list"
    assert:
      - type: contains-all
        value: ["function", "dfs"]
      - type: contains-any
        value: ["visited", "stack", "recursive"]
      - type: llm-rubric
        value: "The code should implement DFS using either recursion or an explicit stack, tracking visited nodes to avoid cycles, and handling disconnected graphs"
      - type: javascript
        value: "output.split('\\n').length > 8"  # Expect substantial implementation

  - vars:
      language: "Python"
      task: "implements a LRU (Least Recently Used) cache with get and put operations, both O(1) time complexity"
    assert:
      - type: contains-all
        value: ["class", "LRU"]
      - type: contains-any
        value: ["OrderedDict", "dict", "HashMap"]
      - type: llm-rubric
        value: "The code should implement an LRU cache using a combination of a hash map and doubly linked list (or OrderedDict), with both get and put operations in O(1) time, including proper capacity management and eviction of least recently used items"
      - type: javascript
        value: "output.includes('get') && output.includes('put') && output.split('\\n').length > 10"

outputPath: results/code_generation_results.json

