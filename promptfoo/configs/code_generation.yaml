# Code Generation Evaluation
description: "Evaluate code generation capabilities across different models"

prompts:
  - |
    Generate a {{language}} function that {{task}}.

    Requirements:
    - Use clear variable names
    - Include basic error handling
    - Add comments explaining the logic

    Provide only the code without additional explanation.

# Sequential execution for Ollama models (prevents GPU overload)
maxConcurrency: 1

