    label: "Qwen3 8B (Local)"
    config:
      temperature: 0.3  # Lower for factual comprehension

  - id: ollama:deepseek-r1:8b
    label: "DeepSeek R1 8B (Local)"
    config:
      temperature: 0.3

  - id: ollama:phi4-reasoning:latest
    label: "Phi-4 Reasoning (Local)"
    config:
      temperature: 0.3

  - id: ollama:qwen2.5-coder:7b
    label: "Qwen2.5 Coder 7B (Local)"
