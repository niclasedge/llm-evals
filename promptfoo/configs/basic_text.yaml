# Article Comprehension Evaluation - Progressive Difficulty
description: "Evaluate text comprehension with 10 progressively challenging questions based on SNAP LLM eval article"

# Article content to analyze
prompts:
  - |
    Read the following article carefully and answer the question.

    {{article}}

    Question: {{question}}

# Sequential execution for Ollama models (prevents GPU overload)
maxConcurrency: 1

# Define the providers (models) to test
providers:
  # Ollama local models - Large (8B+)
