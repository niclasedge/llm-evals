tests:
  # Math reasoning
  - vars:
      problem: "If a train travels 120 miles in 2 hours, and then 180 miles in 3 hours, what is its average speed for the entire journey?"
    assert:
      - type: contains
        value: "60"
      - type: llm-rubric
        value: "The answer should correctly calculate the average speed as 60 mph (total distance 300 miles / total time 5 hours)"

  # Logic puzzle
  - vars:
      problem: "Three friends - Alice, Bob, and Carol - are standing in a line. Alice is not first. Carol is not last. Bob is not in the middle. What is the order from first to last?"
    assert:
      - type: contains-all
        value: ["Carol", "Alice", "Bob"]
      - type: llm-rubric
        value: "The answer should determine the correct order: Carol, Alice, Bob (from first to last)"

  # Pattern recognition
  - vars:
      problem: "What is the next number in this sequence? 2, 6, 12, 20, 30, ?"
    assert:
      - type: contains
        value: "42"
      - type: llm-rubric
        value: "The answer should identify the pattern (differences increase by 2 each time) and conclude with 42"

  # Word problem
  - vars:
      problem: "A store sells apples for $2 each and oranges for $3 each. If someone spends $23 and buys 9 pieces of fruit in total, how many apples did they buy?"
    assert:
      - type: contains
        value: "4"
      - type: llm-rubric
        value: "The answer should solve the system of equations and determine they bought 4 apples and 5 oranges"

  # Deductive reasoning
  - vars:
      problem: "All roses are flowers. Some flowers are red. Can we conclude that some roses are red?"
    assert:
      - type: contains-any
        value: ["cannot", "can't", "no", "not necessarily"]
      - type: llm-rubric
        value: "The answer should correctly identify that this conclusion cannot be drawn from the given premises"

  # Probability
  - vars:
      problem: "You flip a fair coin 3 times. What is the probability of getting exactly 2 heads?"
    assert:
      - type: contains-any
        value: ["3/8", "0.375", "37.5%"]
      - type: llm-rubric
        value: "The answer should calculate the probability as 3/8 or 0.375, accounting for HHT, HTH, and THH outcomes"

  # Spatial reasoning
  - vars:
      problem: "A cube has 6 faces. If you paint the outside of the cube red and then cut it into 27 equal smaller cubes (3x3x3), how many small cubes will have exactly 2 red faces?"
    assert:
      - type: contains
        value: "12"
      - type: llm-rubric
        value: "The answer should identify that edge cubes (not corners) have 2 faces painted, totaling 12 cubes"

outputPath: results/reasoning_results.json

