# Reasoning and Logic Evaluation
description: "Evaluate logical reasoning and problem-solving capabilities"

prompts:
  - |
    Solve the following problem step by step:

    {{problem}}

    Show your reasoning process and provide the final answer clearly.

# Sequential execution for Ollama models (prevents GPU overload)
maxConcurrency: 1

