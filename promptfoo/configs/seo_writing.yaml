tests:
  # Test 1: Tech/Software Keyword
  - vars:
      keyword: "Cloud Computing"
      audience: "IT professionals and business decision makers"
      tone: "professional and authoritative"
    assert:
      # Check minimum word count (approximately 500 words = 2800-3500 characters)
      - type: javascript
        value: "output.split(/\\s+/).length >= 450 && output.split(/\\s+/).length <= 550"
      # Check markdown H1 heading exists
      - type: is-valid-openai-function-call
        value:
          type: object
          properties:
            has_h1:
              type: boolean
          required: [has_h1]
      - type: regex
        value: "^#\\s+.+"
      # Check keyword appears multiple times
      - type: javascript
        value: "(output.match(/cloud computing/gi) || []).length >= 3"
      # Check markdown structure (H2 headings)
      - type: regex
        value: "##\\s+.+"
      # Quality check with LLM rubric
      - type: llm-rubric
        value: |
          Evaluate the SEO article on these criteria:
          1. Has proper markdown structure (H1, H2, H3 headings)
          2. Contains 450-550 words
          3. Uses the keyword "Cloud Computing" naturally 3-5 times
          4. Has clear introduction, body sections, and conclusion
          5. Professional and engaging writing style
          6. Provides valuable information
          Score should be 0.8 or higher for passing.

  # Test 2: E-commerce Keyword
  - vars:
      keyword: "Online Shopping Benefits"
      audience: "general consumers"
      tone: "friendly and persuasive"
    assert:
      - type: javascript
        value: "output.split(/\\s+/).length >= 450 && output.split(/\\s+/).length <= 550"
      - type: regex
        value: "^#\\s+.+"
      - type: javascript
        value: "(output.match(/online shopping/gi) || []).length >= 3"
      - type: regex
        value: "##\\s+.+"
      - type: llm-rubric
        value: |
          Evaluate if the article:
          1. Has proper markdown formatting
          2. Is approximately 500 words
          3. Uses "Online Shopping Benefits" keyword naturally
          4. Has engaging, persuasive tone for consumers
          5. Provides clear benefits and value propositions

  # Test 3: Health & Wellness Keyword
  - vars:
      keyword: "Healthy Morning Routines"
      audience: "health-conscious individuals"
      tone: "motivational and informative"
    assert:
      - type: javascript
        value: "output.split(/\\s+/).length >= 450 && output.split(/\\s+/).length <= 550"
      - type: regex
        value: "^#\\s+.+"
      - type: javascript
        value: "(output.match(/morning routine/gi) || []).length >= 3"
      - type: contains-all
        value: ["#", "##"]
      - type: llm-rubric
        value: |
          Check if the article:
          1. Uses markdown headings properly
          2. Is around 500 words
          3. Incorporates the keyword naturally
          4. Has motivational and informative tone
          5. Provides actionable tips

  # Test 4: Finance Keyword
  - vars:
      keyword: "Personal Finance Management"
      audience: "young professionals"
      tone: "educational and practical"
    assert:
      - type: javascript
        value: "output.split(/\\s+/).length >= 450 && output.split(/\\s+/).length <= 550"
      - type: regex
        value: "^#\\s+.+"
      - type: javascript
        value: "(output.match(/personal finance/gi) || []).length >= 3"
      - type: regex
        value: "##\\s+Introduction"
      - type: regex
        value: "##\\s+Conclusion"
      - type: llm-rubric
        value: |
          Assess the article for:
          1. Proper markdown structure with intro and conclusion
          2. Word count near 500
          3. Natural keyword integration
          4. Educational and practical advice for young professionals
          5. Clear, actionable financial tips

  # Test 5: Travel Keyword
  - vars:
      keyword: "Budget Travel Tips"
      audience: "adventure seekers and backpackers"
      tone: "enthusiastic and helpful"
    assert:
      - type: javascript
        value: "output.split(/\\s+/).length >= 450 && output.split(/\\s+/).length <= 550"
      - type: regex
        value: "^#\\s+.+"
      - type: javascript
        value: "(output.match(/budget travel/gi) || []).length >= 3"
      - type: contains-all
        value: ["#", "##", "travel", "budget"]
      - type: llm-rubric
        value: |
          Evaluate for:
          1. Markdown formatting with multiple section headings
          2. Approximately 500 words
          3. "Budget Travel Tips" used naturally throughout
          4. Enthusiastic and helpful tone
          5. Practical, money-saving travel advice

outputPath: results/seo_writing_results.json

# Default test options
defaultTest:
  options:
    # Allow longer responses for 500-word articles
    maxTokens: 1500
