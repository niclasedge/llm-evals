# SEO Content Writing Evaluation
description: "Evaluate models on writing high-quality, SEO-optimized content in markdown format"

prompts:
  - |
    Write a professional, SEO-optimized article about "{{keyword}}" in markdown format.

    Requirements:
    - Length: Exactly 500 words
    - Format: Markdown with proper headings (H1, H2, H3)
    - Include: Introduction, main body with subheadings, conclusion
    - SEO optimization: Use the keyword naturally 3-5 times
    - Writing style: Professional, engaging, informative
    - Target audience: {{audience}}
    - Tone: {{tone}}

    Structure your article with:
    - # Main Title (H1) - should include the keyword
    - ## Introduction
    - ## Main sections (2-3 H2 sections with H3 subsections)
    - ## Conclusion

    Write naturally and provide value to the reader. Avoid keyword stuffing.

# Sequential execution for Ollama models (prevents GPU overload)
maxConcurrency: 1

providers:
  # Ollama local models - Large (8B+) - Best for creative writing
  - id: ollama:qwen3:8b
    label: "Qwen3 8B (Local)"
    config:
      temperature: 0.8  # Higher for creative writing

  - id: ollama:deepseek-r1:8b
    label: "DeepSeek R1 8B (Local)"
    config:
      temperature: 0.8

