# Default models for different use cases
defaults:
  text_model: "qwen3-8b-local"
  vision_model: "llama3.2-vision-11b-local"
  code_model: "qwen2.5-coder-local"
  local_model: "qwen3-8b-local"
  free_model: "qwen3-8b-local"
  reasoning_model: "phi4-reasoning-local"