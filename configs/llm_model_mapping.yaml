    - "phi4-reasoning-local"
    - "qwen2.5-coder-local"
    - "qwen3-8b-local"
    - "qwen3-4b-local"
    - "llama3.2-3b-local"
    - "llama3.2-1b-local"
    - "gemma3-4b-local"
    - "gemma3-1b-local"
    - "mistral-7b-local"
