# LLM Model Mapping Configuration
# This file defines the unified configuration for all LLM providers and models

providers:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    models:
      # Verified working free models (January 2025)
      - name: "llama-3.1-8b-openrouter"
        model_id: "meta-llama/llama-3.1-8b-instruct:free"
        aliases: ["llama3.1", "llama3.1-8b", "llama31"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          context_length: 8192
          description: "Meta's Llama 3.1 8B parameter model"

      - name: "qwen2-7b-openrouter"
        model_id: "qwen/qwen-2-7b-instruct:free"
        aliases: ["qwen2-7b", "qwen7b"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          context_length: 32768
          description: "Qwen2 7B model with strong coding capabilities"

  ollama:
    base_url: "http://localhost:11434"
    models:
      # Available models (verified via ollama list)
      - name: "deepseek-r1-8b-local"
        model_id: "deepseek-r1:8b"
        aliases: ["deepseek-r1-local", "deepseek-8b-local"]
        capabilities: ["text", "reasoning", "code"]
        free: true
        enabled: true
        metadata:
          description: "Local DeepSeek R1 8B model via Ollama"

      - name: "phi4-reasoning-local"
        model_id: "phi4-reasoning:latest"
        aliases: ["phi4-local", "phi4-reasoning-local"]
        capabilities: ["text", "reasoning", "math"]
        free: true
        enabled: true
        metadata:
          description: "Local Phi-4 reasoning model via Ollama"

      - name: "qwen2.5-coder-local"
        model_id: "qwen2.5-coder:7b"
        aliases: ["qwen-coder", "qwen2.5-coder"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          description: "Local Qwen2.5 Coder model via Ollama"

      - name: "qwen3-8b-local"
        model_id: "qwen3:8b"
        aliases: ["qwen3-8b", "qwen3-local"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          description: "Local Qwen3 8B model via Ollama"

      - name: "qwen3-4b-local"
        model_id: "qwen3:4b"
        aliases: ["qwen3-4b"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          description: "Local Qwen3 4B model via Ollama"

      - name: "llama3.2-3b-local"
        model_id: "llama3.2:3b"
        aliases: ["llama3.2-3b"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          description: "Local Llama 3.2 3B model via Ollama"

      - name: "llama3.2-1b-local"
        model_id: "llama3.2:1b"
        aliases: ["llama3.2-1b"]
        capabilities: ["text"]
        free: true
        enabled: true
        metadata:
          description: "Local Llama 3.2 1B model via Ollama"

      - name: "gemma3-4b-local"
        model_id: "gemma3:4b"
        aliases: ["gemma3-4b"]
        capabilities: ["text"]
        free: true
        enabled: true
        metadata:
          description: "Local Gemma3 4B model via Ollama"

      - name: "gemma3-1b-local"
        model_id: "gemma3:1b"
        aliases: ["gemma3-1b"]
        capabilities: ["text"]
        free: true
        enabled: true
        metadata:
          description: "Local Gemma3 1B model via Ollama"

      - name: "mistral-7b-local"
        model_id: "mistral:7b"
        aliases: ["mistral-7b"]
        capabilities: ["text", "code"]
        free: true
        enabled: true
        metadata:
          description: "Local Mistral 7B model via Ollama"

      # Vision models
      - name: "llama3.2-vision-11b-local"
        model_id: "llama3.2-vision:11b"
        aliases: ["llama3.2-vision", "llama-vision-local"]
        capabilities: ["text", "vision"]
        free: true
        enabled: true
        metadata:
          description: "Local Llama 3.2 11B vision model via Ollama"
      
      # Legacy models (disabled by default)
      - name: "llama3-local"
        model_id: "llama3"
        aliases: ["llama-local", "l3", "llama3-ollama"]
        capabilities: ["text", "code"]
        free: true
        enabled: false
        metadata:
          description: "Local Llama 3 model via Ollama"
      
      - name: "mistral-local"
        model_id: "mistral"
        aliases: ["mistral-local", "mistral-ollama"]
        capabilities: ["text", "code"]
        free: true
        enabled: false
        metadata:
          description: "Local Mistral model via Ollama"
      
      - name: "llava-local"
        model_id: "llava:latest"
        aliases: ["llava", "llava-vision", "llava-ollama"]
        capabilities: ["text", "vision"]
        free: true
        enabled: false
        metadata:
          description: "Local LLaVA vision model via Ollama"
      
      - name: "llava-7b-local"
        model_id: "llava:7b"
        aliases: ["llava7b", "llava-7b"]
        capabilities: ["text", "vision"]
        free: true
        enabled: false
        metadata:
          description: "Local LLaVA 7B vision model via Ollama"
      
      - name: "llava-13b-local"
        model_id: "llava:13b"
        aliases: ["llava13b", "llava-13b"]
        capabilities: ["text", "vision"]
        free: true
        enabled: false
        metadata:
          description: "Local LLaVA 13B vision model via Ollama"
      
      - name: "bakllava-local"
        model_id: "bakllava:latest"
        aliases: ["bakllava", "bakllava-vision"]
        capabilities: ["text", "vision"]
        free: true
        enabled: false
        metadata:
          description: "Local BakLLaVA vision model via Ollama"
      
      - name: "moondream-local"
        model_id: "moondream:latest"
        aliases: ["moondream", "moondream-vision"]
        capabilities: ["text", "vision"]
        free: true
        enabled: false
        metadata:
          description: "Local Moondream vision model via Ollama"

