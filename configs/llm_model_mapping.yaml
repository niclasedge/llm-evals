    - "qwen2.5-coder-local"
    - "qwen3-8b-local"
    - "qwen3-4b-local"
    - "llama3.2-3b-local"
    - "mistral-7b-local"

  reasoning_models:
    - "phi4-reasoning-local"
    - "deepseek-r1-8b-local"

  free_models:
    - "llama-3.1-8b-openrouter"
    - "qwen2-7b-openrouter"
