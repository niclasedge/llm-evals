name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke tests (no LLM provider is called)
        run: python -m pytest tests/test_smoke.py -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/go-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: archive/go-service/go.mod
          cache-dependency-path: archive/go-service/go.sum
      - run: go build ./...
      - run: go vet ./...
      # The auto_reload, rollback and logging packages have known failures (see README, "Status and limits").
      - name: Tests (stable packages)
        run: >
          go test
          ./internal/...
          ./tests/database
          ./tests/integration
          ./tests/monitoring
          ./tests/unit
          ./tests/unit/devtools
