version: '3.8'

services:
  go-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: llm-eval-go-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OLLAMA_HOST=host.docker.internal:11434
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - llm-eval-network

networks:
  llm-eval-network:
    driver: bridge