version: '3.8'

services:
  # Ollama service (LLM backend)
  ollama:
    image: ollama/ollama:latest
    container_name: llm-eval-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - llm-eval-network

  # Go service (performance proxy)
  go-service:
    build:
      context: ./go-service
      dockerfile: docker/Dockerfile
    container_name: llm-eval-go-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - GO_DB_PATH=/data/evaluation.db
      - GIN_MODE=release
    volumes:
      - go_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - llm-eval-network

  # Python evaluation service
  python-service:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: llm-eval-python
    ports:
      - "8000:8000"
    environment:
      - ENABLE_GO_SERVICE=true
      - GO_SERVICE_URL=http://go-service:8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_LOCAL_MODELS=true
      - PYTHONPATH=/app
    volumes:
      - python_data:/app/data
      - test_results:/app/test_results
      - ./logs:/app/logs
    depends_on:
      go-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - llm-eval-network

  # Monitoring service (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-eval-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - go-service
      - python-service
    restart: unless-stopped
    networks:
      - llm-eval-network

  # Dashboard service (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: llm-eval-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - llm-eval-network

  # Reverse proxy (nginx)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: llm-eval-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - python-service
      - go-service
      - grafana
    restart: unless-stopped
    networks:
      - llm-eval-network

volumes:
  ollama_data:
  go_data:
  python_data:
  test_results:
  prometheus_data:
  grafana_data:

networks:
  llm-eval-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16