version: '3.8'

services:
  ollama:
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    environment:
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_NUM_PARALLEL=4

  go-service:
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5

  python-service:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    environment:
      - PYTHON_DEBUG=false
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
      - WORKERS=4
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/prod-dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/prod-datasources:/etc/grafana/provisioning/datasources

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl